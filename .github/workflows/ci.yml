name: AStarDev.AStarDev.CloudSync CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

env:
  DOTNET_VERSION: "11.0.x"
  SOLUTION_FILE: "AStarDev.slnx"

jobs:
  architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Run Architecture Tests
        run: >
          dotnet test
          apps/desktop/AStarDev.CloudSync/AStarDev.CloudSync.TestsArchitecture/AStarDev.CloudSync.TestsArchitecture.csproj
          --configuration Release
          --verbosity normal

  build:
    name: Build
    needs: architecture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --configuration Release
          --no-restore

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run unit tests and collect coverage (XPlat)
        run: |
          dotnet test --solution ${{ env.SOLUTION_FILE }} --no-build --configuration Release --results-directory TestResults --coverage --coverage-output-format cobertura --filter-not-namespace "*Integration*" --filter-not-namespace "*Architecture*"

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Integration Tests
        run: dotnet test --solution ${{ env.SOLUTION_FILE }} --no-build --configuration Release --results-directory TestResults --coverage --coverage-output-format cobertura --filter-namespace "*Integration*"
