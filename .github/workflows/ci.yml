name: AStarDev.AStarDev.CloudSync CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

env:
  DOTNET_VERSION: '11.0.x'

jobs:

  architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Run Architecture Tests
        run: >
          dotnet test
          tests/AStarDev.AStarDev.CloudSync.ArchitectureTests
          --configuration Release
          --verbosity normal

  build:
    name: Build
    needs: architecture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --configuration Release
          --no-restore

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Unit Tests
        run: >
          dotnet test
          tests/AStarDev.CloudSync.UnitTests
          --configuration Release
          --no-build

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Integration Tests
        run: >
          dotnet test
          tests/AStarDev.CloudSync.IntegrationTests
          --configuration Release
          --no-build
